\/li>\n                <li>Kullanım verisi: tarama geçmişi meta verileri (tarih, sonuç yüzdesi) — taradığınız görselin kendisi değil<\/li>\n                <li>Tercih verisi: dil ve tema (açık/koyu) tercihiniz<\/li>\n            <\/ul>\n            <p class=\"mt-3 font-semibold text-slate-100\">Önemli: Analiz için yüklediğiniz görseller sunucularımızda kalıcı olarak saklanmaz; analiz tamamlandıktan hemen sonra bellekten silinir.<\/p>\n        <\/section>\n\n        <section class=\"mb-8\">\n            <h2 class=\"text-xl font-semibold text-indigo-400 mb-3\">3. İşleme Amaçları<\/h2>\n            <p>Kişisel verileriniz; hesabınızı oluşturmak ve doğrulamak, size hizmet sunmak, ücretsiz/ücretli tarama haklarınızı takip etmek, güvenliği sağlamak ve yasal yükümlülüklerimizi yerine getirmek amacıyla işlenir.<\/p>\n        <\/section>\n\n        <section class=\"mb-8\">\n            <h2 class=\"text-xl font-semibold text-indigo-400 mb-3\">4. Verilerin Aktarıldığı Üçüncü Taraflar<\/h2>\n            <p class=\"mb-2\">Hizmeti sağlayabilmek için aşağıdaki yurt dışı kaynaklı hizmet sağlayıcılarla sınırlı ölçüde veri paylaşılır:<\/p>\n            <ul class=\"list-disc list-inside space-y-1 text-slate-300\">\n                <li><strong>Render.com<\/strong> (ABD) — sunucu barındırma<\/li>\n                <li><strong>Resend.com<\/strong> (ABD) — doğrulama email'lerinin gönderimi<\/li>\n                <li><strong>Hugging Face<\/strong> (ABD) — model dosyasının kaynağı; standart analizde fotoğraf bu hizmete gönderilmez<\/li>\n                <li><strong>Google LLC<\/strong> (ABD) — Google ile giriş özelliği<\/li>\n            <\/ul>\n            <p class=\"mt-2 text-sm text-slate-400\">Bu aktarımlar KVKK madde 9 kapsamında, hizmetin sunulabilmesi için zorunlu asgari veriyle sınırlı tutulur.<\/p>\n        <\/section>\n\n        <section class=\"mb-8\">\n            <h2 class=\"text-xl font-semibold text-indigo-400 mb-3\">5. Saklama Süresi<\/h2>\n            <p>Hesap verileriniz, hesabınız aktif olduğu sürece saklanır. Hesabınızın silinmesini talep etmeniz halinde verileriniz makul bir süre içinde silinir veya anonim hale getirilir.<\/p>\n        <\/section>\n\n        <section class=\"mb-8\">\n            <h2 class=\"text-xl font-semibold text-indigo-400 mb-3\">6. KVKK Madde 11 Kapsamındaki Haklarınız<\/h2>\n            <p class=\"mb-2\">KVKK'nın 11. maddesi uyarınca aşağıdaki haklara sahipsiniz:<\/p>\n            <ul class=\"list-disc list-inside space-y-1 text-slate-300\">\n                <li>Kişisel verinizin işlenip işlenmediğini öğrenme<\/li>\n                <li>İşlenmişse buna ilişkin bilgi talep etme<\/li>\n                <li>İşlenme amacını ve amacına uygun kullanılıp kullanılmadığını öğrenme<\/li>\n                <li>Yurt içinde/yurt dışında aktarıldığı üçüncü kişileri bilme<\/li>\n                <li>Eksik/yanlış işlenmişse düzeltilmesini isteme<\/li>\n                <li>Kanuni şartlar çerçevesinde silinmesini/yok edilmesini isteme<\/li>\n                <li>İşlenen verinin münhasıran otomatik sistemlerle analiz edilmesi sonucu aleyhinize bir sonucun ortaya çıkmasına itiraz etme<\/li>\n                <li>Zarara uğramanız halinde zararın giderilmesini talep etme<\/li>\n            <\/ul>\n            <p class=\"mt-3\">Bu haklarınızı kullanmak için <a href=\"mailto:[İLETİŞİM E-POSTASI]\" class=\"text-indigo-400 underline\">[İLETİŞİM E-POSTASI]<\/a> adresine yazılı olarak başvurabilirsiniz.<\/p>\n        <\/section>\n\n        <section class=\"mb-8\">\n            <h2 class=\"text-xl font-semibold text-indigo-400 mb-3\">7. Çerezler ve Yerel Depolama<\/h2>\n            <p>Sitede oturum tercihlerinizi (dil, tema, ücretsiz tarama hakkı sayacı) hatırlamak için tarayıcınızın yerel depolama alanı (localStorage) kullanılır. Bu veriler kendi cihazınızda tutulur ve bize otomatik olarak iletilmez.<\/p>\n        <\/section>\n\n        <section class=\"mb-8\">\n            <h2 class=\"text-xl font-semibold text-indigo-400 mb-3\">8. Google Kullanıcı Verileri Politikası Uyumu<\/h2>\n            <p>Google ile giriş özelliği yalnızca kimlik doğrulama (email adresinizi almak) amacıyla kullanılır. Google hesap verileriniz reklam amacıyla kullanılmaz, satılmaz veya paylaşılmaz.<\/p>\n        <\/section>\n\n        <section>\n            <h2 class=\"text-xl font-semibold text-indigo-400 mb-3\">9. İletişim<\/h2>\n            <p>Bu politikayla ilgili sorularınız için: <a href=\"mailto:[İLETİŞİM E-POSTASI]\" class=\"text-indigo-400 underline\">[İLETİŞİM E-POSTASI]<\/a><\/p>\n        <\/section>\n    <\/div>", "en": "<div class=\"max-w-3xl mx-auto py-8 policy-en\"><a href=\"index.html\">← Back to the site<\/a><h1>Privacy Policy and KVKK Information Notice<\/h1><p>Last updated: [DATE]<\/p><section><h2>1. Data controller<\/h2><p>Under Turkish Personal Data Protection Law No. 6698 (KVKK), the controller for personal data processed through this website is:<\/p><p><strong>[COMPANY / INDIVIDUAL NAME]<\/strong><br>Address: [ADDRESS]<br>Tax / identification number: [TAX / ID NUMBER]<br>Email: [CONTACT EMAIL]<\/p><\/section><section><h2>2. Personal data processed<\/h2><ul><li>Identity/contact data: your email address.<\/li><li>Account security: a hashed password; your plaintext password is never stored.<\/li><li>If you sign in with Google: your Google account email.<\/li><li>Usage data: scan history metadata (date and result score), not the scanned image.<\/li><li>Preferences: language and light/dark theme.<\/li><\/ul><p>Images uploaded for analysis are not permanently stored on our servers; they are removed from memory after processing.<\/p><\/section><section><h2>3. Processing purposes<\/h2><p>Personal data is processed to create and verify accounts, provide the service, track free/paid scan allowances, maintain security and meet legal obligations.<\/p><\/section><section><h2>4. Third-party providers<\/h2><p>Limited data is shared with the following overseas providers to operate the service:<\/p><ul><li>Render.com (USA): server hosting.<\/li><li>Resend.com (USA): verification emails.<\/li><li>Hugging Face (USA): model file source; standard analysis does not send photos to this service.<\/li><li>Google LLC (USA): Google sign-in.<\/li><\/ul><p>These transfers are limited to the minimum data needed for the service under Article 9 of KVKK.<\/p><\/section><section><h2>5. Retention<\/h2><p>Account data is retained while your account is active. Upon a deletion request, data is deleted or anonymized within a reasonable time.<\/p><\/section><section><h2>6. Rights under Article 11 of KVKK<\/h2><ul><li>Learn whether your personal data is processed.<\/li><li>Request information if it has been processed.<\/li><li>Learn the purpose of processing and whether use follows that purpose.<\/li><li>Learn the third parties receiving data domestically or abroad.<\/li><li>Request correction of incomplete or incorrect data.<\/li><li>Request deletion or destruction under the legal conditions.<\/li><li>Object to an adverse outcome resulting exclusively from automated analysis.<\/li><li>Request compensation for damage.<\/li><\/ul><p>To exercise these rights, send a written request to [CONTACT EMAIL].<\/p><\/section><section><h2>7. Cookies and local storage<\/h2><p>Browser localStorage remembers language, theme and the free scan counter. This data stays on your device and is not automatically sent to us.<\/p><\/section><section><h2>8. Google user data policy<\/h2><p>Google sign-in is used only for authentication (obtaining your email). Google account data is not used for advertising, sold or shared.<\/p><\/section><section><h2>9. Contact<\/h2><p>For questions about this policy: [CONTACT EMAIL]<\/p><\/section><\/div>"};const policyTitles={"tr": "Gizlilik Politikası ve KVKK Aydınlatma Metni - AI Image Detector Pro", "en": "Privacy Policy | AI Image Detector"};function renderPolicyLanguage(){const lang=localStorage.getItem("lang")==="tr"?"tr":"en";document.documentElement.lang=lang;document.title=policyTitles[lang];document.getElementById("policyContent").innerHTML=policyContent[lang];document.getElementById("policyLanguage").textContent=lang.toUpperCase();}document.getElementById("policyLanguage").onclick=()=>{localStorage.setItem("lang",localStorage.getItem("lang")==="tr"?"en":"tr");renderPolicyLanguage();};window.addEventListener("storage",event=>{if(event.key==="lang")renderPolicyLanguage();});renderPolicyLanguage();</script>
