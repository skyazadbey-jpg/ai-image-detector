<body class="bg-slate-900 text-slate-100 min-h-screen p-4 sm:p-6 font-sans">
    <div class="max-w-3xl mx-auto pt-6"><button id="policyLanguage" class="px-4 py-2 rounded-xl border border-slate-600">EN / TR</button></div><main id="policyContent"></main><style>.policy-en h1{font-size:2rem;font-weight:700;margin:1rem 0}.policy-en h2{font-size:1.25rem;font-weight:600;color:#a5b4fc;margin:1.5rem 0 .75rem}.policy-en p{margin:.75rem 0}.policy-en a{color:#818cf8}.policy-en ul{list-style:disc;padding-left:1.25rem}.policy-en section{margin-bottom:2rem}</style><script>const policyContent={"tr": "<div class=\"max-w-3xl mx-auto py-8\">\n\n        <a href=\"index.html\" class=\"inline-flex items-center gap-2 text-indigo-400 hover:text-indigo-300 text-sm font-semibold mb-8\">\n            <i class=\"fas fa-arrow-left\"><\/i> Ana sayfaya dön\n        <\/a>\n\n        <h1 class=\"font-display text-3xl sm:text-4xl font-bold mb-3\">Nasıl Çalışır?<\/h1>\n        <p class=\"text-slate-400 mb-10\">Bu sayfa, sistemimizin bir görseli nasıl analiz ettiğini, gerçek doğruluk oranlarını ve sınırlarını olduğu gibi anlatır. Çoğu benzer araç bu bilgileri paylaşmaz — biz paylaşıyoruz, çünkü size doğru beklenti vermek istiyoruz.<\/p>\n\n        <section class=\"mb-10\">\n            <h2 class=\"font-display text-xl font-bold mb-3\">Analiz nasıl yapılıyor?<\/h2>\n            <p class=\"text-slate-300 leading-relaxed\">Görsel, sunucuda ConvNeXt tabanlı bir modelle analiz edilir. Modelin AI skoru 70'in üstündeyse AI yönünde, 50'nin altındaysa gerçek fotoğraf yönünde sonuç gösterilir; aradaki sonuçlar belirsizdir. Skor, ölçülmüş bir olasılık veya kesinlik garantisi değildir.<\/p>\n            <p class=\"text-slate-300 leading-relaxed mt-3\">Genel, Araba ve Emlak modları aynı analiz motorunu kullanır. Araba ve Emlak modlarında yerel bir nesne modeli kategori ipuçlarını kontrol eder. Seçilen bölüme uymayan içerik için uyarı gösterilebilir; emin olunamayan görseller engellenmez. Bu kontrol AI skorunu değiştirmez ve mülkün kimliğini doğrulamaz. Ek doğrulama önerileri de gösterilir. Fotoğraftan araç hasarı, mülkiyet veya satıcının güvenilirliği belirlenmez. Bu sürümde ısı haritası üretilmez.<\/p>\n        <\/section>\n        <section class=\"mb-10\">\n            <h2 class=\"font-display text-xl font-bold mb-3\">3 Ekim 2026 test sonuçları<\/h2>\n            <p class=\"text-slate-300 leading-relaxed\">Yerel Windows testinde ilk 200 görsel model karşılaştırması için kullanıldı: 158 doğru, 39 yanlış, 3 belirsiz (%79). Daha sonra ayrılan, ilk grupla aynı dosyaları içermeyen 200 görselde 170 doğru, 26 yanlış, 4 belirsiz elde edildi (%85). İki grubun toplamı 328/400, yani %82'dir. Belirsiz sonuçlar başarı sayılmadı; istek hatası oluşmadı.<\/p>\n            <p class=\"text-slate-300 leading-relaxed mt-3\">Aynı ayrı 200 görsel, yayındaki Render sunucusunda tekrar analiz edildi: 169 doğru, 29 yanlış, 2 belirsiz, 0 istek hatası (%84,5). 100 AI görselin 83'ü, 100 gerçek görselin 86'sı doğru bulundu. Bilgisayar ile sunucu skorları değişebildiği için canlı başarı ayrıca ölçüldü. Bu tekrar yeni bir 200 görsel grubu değildir.<\/p>\n            <p class=\"text-slate-300 leading-relaxed mt-3\">Her grup 100 gerçek ve 100 AI görseli içerir. Gerçek örnekler <a class=\"text-indigo-400\" href=\"https://huggingface.co/datasets/bitmind/open-images-v7-subset\">OpenImages<\/a>, AI örnekleri eşit sayıda <a class=\"text-indigo-400\" href=\"https://huggingface.co/datasets/bitmind/MS-COCO-unique___FLUX.1-dev\">FLUX<\/a> ve <a class=\"text-indigo-400\" href=\"https://huggingface.co/datasets/bitmind/MS-COCO-unique___stable-diffusion-xl-base-1.0\">SDXL<\/a> koleksiyonlarından alınmıştır. Kaynak yayıncının etiketleri kullanılmıştır; modelin eğitim verileriyle olası örtüşme bilinmemektedir. Örnekler rastgele seçilen satır aralıklarından alındı; bu ölçüm tüm görselleri temsil etmez.<\/p>\n            <p class=\"text-slate-400 text-sm mt-3\">Bu genel test araç, emlak ve Gemini görsellerindeki ayrı başarıyı ölçmez. Ayrı ProGAN araba testinde 200 görselin 173’ü doğru, 23’ü yanlış ve 4’ü belirsiz çıktı (%86,5); bu tek üreticili test tüm araba ilanlarına genellenmez. Ayrı LSUN-Bedroom iç mekân testinde 100 gerçek ve 10 üreticiden toplam 100 AI odanın 150’si doğru, 46’sı yanlış, 4’ü belirsiz çıktı (%75). Bu oranlar dış cephelerde, tüm ilanlarda veya her yeni görselde aynı başarıyı garanti etmez. Kullanılan model: <a class=\"text-indigo-400\" href=\"https://huggingface.co/xRayon/convnext-ai-images-detector\">xRayon ConvNeXt<\/a>, sabit sürüm, ONNX dinamik INT8 kopyası.<\/p>\n        <\/section>\n        <section class=\"mb-10\">\n            <h2 class=\"font-display text-xl font-bold mb-3 flex items-center gap-2\">\n                <i class=\"fas fa-triangle-exclamation text-amber-400\"><\/i> Sınırlarımız - dürüstçe\n            <\/h2>\n            <ul class=\"space-y-3 text-slate-300 text-sm leading-relaxed\">\n                <li class=\"flex gap-3\"><i class=\"fas fa-circle-minus text-amber-400 mt-1 text-xs\"><\/i> Çok yüksek kaliteli, özenle üretilmiş yapay zeka görselleri bazen \"gerçek\" olarak değerlendirilebilir.<\/li>\n                <li class=\"flex gap-3\"><i class=\"fas fa-circle-minus text-amber-400 mt-1 text-xs\"><\/i> Ağır filtrelenmiş, düzenlenmiş veya sıkıştırılmış gerçek fotoğraflar bazen \"yapay zeka\" olarak işaretlenebilir.<\/li>\n                <li class=\"flex gap-3\"><i class=\"fas fa-circle-minus text-amber-400 mt-1 text-xs\"><\/i> Render, üç boyutlu çizim ve gerçek fotoğraf ayrımı bu model için zor olabilir.<\/li>\n                <li class=\"flex gap-3\"><i class=\"fas fa-circle-minus text-amber-400 mt-1 text-xs\"><\/i> Sonuçlarımız <strong class=\"text-slate-200\">bir ipucudur, kesin hüküm değildir<\/strong>. Önemli bir alım-satım kararı öncesi mutlaka ek doğrulama yapın (tapu, TRAMER, yüz yüze görüşme).<\/li>\n            <\/ul>\n        <\/section>\n\n        <section class=\"mb-10\">\n            <h2 class=\"font-display text-xl font-bold mb-3\">Sürekli gelişim nasıl ölçülür?<\/h2>\n            <p class=\"text-slate-300\">Model cevapları, yanıt süresi ve hata durumu çalışma kayıtlarına yazılır; fotoğraf, dosya adı, EXIF değerleri ve URL bu kayıtlara eklenmez. Kullanıcı geri bildirimleri doğrulanmamış beyanlardır; otomatik eğitim için kullanılmaz. Otomatik öğrenme veya model terfisi şu anda etkin değildir. Bunlar bağımsız ve doğrulanmış test örnekleri gerektirir.<\/p>\n        <\/section>\n\n        <section class=\"mb-4\">\n            <h2 class=\"font-display text-xl font-bold mb-3 flex items-center gap-2\">\n                <i class=\"fas fa-lock text-indigo-400\"><\/i> Verileriniz\n            <\/h2>\n            <p class=\"text-slate-300 leading-relaxed\">\n                Yüklediğiniz görseller analiz için anlık olarak işlenir ve sunucularımızda kalıcı olarak saklanmaz. Detaylar için <a href=\"privacy.html\" class=\"text-indigo-400 hover:underline\">Gizlilik Politikamıza<\/a> bakabilirsiniz.\n            <\/p>\n        <\/section>\n\n        <div class=\"text-center mt-12\">\n            <a href=\"index.html\" class=\"inline-flex items-center gap-2 bg-indigo-600 hover:bg-indigo-500 transition text-white font-bold px-6 py-3 rounded-xl\">\n                <i class=\"fas fa-magnifying-glass\"><\/i> Bir görsel test et\n            <\/a>\n        <\/div>\n\n    <\/div>", "en": "<div class=\"max-w-3xl mx-auto py-8 policy-en\"><a href=\"index.html\">← Back to the site<\/a><h1>How does it work?<\/h1><p>This page explains how images are analyzed, our measured accuracy and the limits of the system.<\/p><section><h2>How is an image analyzed?<\/h2><p>A ConvNeXt model analyzes the image on the server. Scores above 70 indicate AI, scores below 50 indicate a real photo, and scores from 50 through 70 are uncertain. Scores are not measured probabilities or guarantees.<\/p><p>General, Car and Property use the same analysis engine. A local object model checks category hints in Car and Property. A mismatch may produce a warning; uncertain images are not rejected. This does not change the AI score or verify property identity. Additional verification guidance is provided. Photos do not establish vehicle damage, ownership or seller trustworthiness. This version does not produce heatmaps.<\/p><\/section><section><h2>Test results — October 3, 2026<\/h2><p>The initial 200-image Windows model comparison produced 158 correct, 39 incorrect and 3 uncertain results (79%). A separate 200-image group without duplicate files produced 170 correct, 26 incorrect and 4 uncertain (85%). Combined: 328/400 (82%). Uncertain results were not counted as successes; no request errors occurred.<\/p><p>The same separate group was tested on the live Render server: 169 correct, 29 incorrect, 2 uncertain, 0 request errors (84.5%). Correct: 83/100 AI and 86/100 real. Computer and server scores can differ, so live accuracy was measured separately. This repeat is not a new 200-image group.<\/p><p>Each group contains 100 real and 100 AI images. Real examples came from <a href=\"https://huggingface.co/datasets/bitmind/open-images-v7-subset\">OpenImages<\/a>; AI examples were evenly divided between <a href=\"https://huggingface.co/datasets/bitmind/MS-COCO-unique___FLUX.1-dev\">FLUX<\/a> and <a href=\"https://huggingface.co/datasets/bitmind/MS-COCO-unique___stable-diffusion-xl-base-1.0\">SDXL<\/a>. Publisher labels were used; overlap with training data is unknown. Samples came from randomly chosen row ranges and do not represent every image.<\/p><p>The general test does not separately measure vehicles, property or Gemini. A separate ProGAN car test produced 173 correct, 23 incorrect and 4 uncertain out of 200 (86.5%); this single-generator result does not generalize to all car listings. A separate LSUN-Bedroom test contained 100 real rooms and 100 AI rooms from 10 generators: 150 correct, 46 incorrect, 4 uncertain (75%). These rates do not guarantee the same performance on exteriors, all listings or every new image. Model: <a href=\"https://huggingface.co/xRayon/convnext-ai-images-detector\">xRayon ConvNeXt<\/a>, pinned version, dynamic INT8 ONNX copy.<\/p><\/section><section><h2>Our limitations<\/h2><ul><li>High-quality AI images can be classified as real.<\/li><li>Heavily filtered, edited or compressed real photos can be classified as AI.<\/li><li>Distinguishing renders, 3D artwork and photos can be difficult for this model.<\/li><li>Results are clues, not conclusive judgments. Verify documents, vehicle history and the seller in person before an important transaction.<\/li><\/ul><\/section><section><h2>How is improvement measured?<\/h2><p>Model responses, response times and errors are logged. Photos, filenames, EXIF values and URLs are not added to these records. User feedback is unverified and is not used for automatic training. Automatic learning or model promotion is not active. These require independent, verified test examples.<\/p><\/section><section><h2>Your data<\/h2><p>Uploaded images are processed for analysis and are not permanently stored on our servers. See the <a href=\"privacy.html\">Privacy Policy<\/a>.<\/p><\/section><a href=\"index.html\">Test an image →<\/a><\/div>"};const policyTitles={"tr": "Nasıl Çalışır? | AI Görsel Tespit Metodolojisi", "en": "How it works | AI Image Detector"};function renderPolicyLanguage(){const lang=localStorage.getItem("lang")==="tr"?"tr":"en";document.documentElement.lang=lang;document.title=policyTitles[lang];document.getElementById("policyContent").innerHTML=policyContent[lang];document.getElementById("policyLanguage").textContent=lang.toUpperCase();}document.getElementById("policyLanguage").onclick=()=>{localStorage.setItem("lang",localStorage.getItem("lang")==="tr"?"en":"tr");renderPolicyLanguage();};window.addEventListener("storage",event=>{if(event.key==="lang")renderPolicyLanguage();});renderPolicyLanguage();</script>
